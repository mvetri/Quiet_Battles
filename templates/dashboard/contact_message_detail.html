<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Details | Quiet Battles</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px;
            background: #f4f5f7;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
        }

        .detail {
            margin: 25px 0;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .detail strong {
            display: block;
            margin-bottom: 10px;
            color: #777;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .message-content {
            white-space: pre-wrap;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        a {
            display: inline-block;
            padding: 12px 18px;
            background: #171717;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Message Details</h1>

        <div class="detail">
            <strong>CUSTOMER NAME</strong>
            {{ contact_message.name }}
        </div>

        <div class="detail">
            <strong>EMAIL ADDRESS</strong>
            {{ contact_message.email }}
        </div>

        <div class="detail">
            <strong>SUBJECT</strong>
            {{ contact_message.subject }}
        </div>

        <div class="detail">
            <strong>MESSAGE</strong>
            <div class="message-content">{{ contact_message.message }}</div>
        </div>

        <div class="detail">
            <strong>SUBMITTED DATE</strong>
            {{ contact_message.created_at|date:"d M Y, h:i A" }}
        </div>

        <a href="{% url 'contact_message_list' %}">
            ← Back to Messages
        </a>

    </div>

</body>

</html>
