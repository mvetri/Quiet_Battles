{% extends 'base.html' %}

{% block content %}

<style>
    .detail-section {
        background: #0b0b0b;
        color: white;
        min-height: 100vh;
        padding: 70px 8%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        align-items: center;
    }

    .detail-image img {
        width: 100%;
        max-height: 600px;
        object-fit: cover;
    }

    .detail-info p {
        color: #aaa;
        letter-spacing: 2px;
    }

    .detail-info h1 {
        font-size: 38px;
        margin: 20px 0;
    }

    .detail-info h2 {
        font-size: 24px;
        margin-bottom: 20px;
    }

    .detail-info .description {
        line-height: 1.8;
        margin: 25px 0;
    }

    .size-options {
        display: flex;
        gap: 15px;
        margin: 15px 0 25px;
    }

    .size-options label {
        border: 1px solid #777;
        padding: 12px 18px;
        cursor: pointer;
    }

    .detail-info input[type="number"] {
        display: block;
        width: 75px;
        padding: 10px;
        margin: 12px 0 25px;
    }

    .cart-btn {
        background: white;
        color: black;
        border: none;
        padding: 15px 30px;
        cursor: pointer;
        letter-spacing: 2px;
    }

    .back-link {
        display: inline-block;
        margin-top: 25px;
        color: white;
    }

    @media (max-width: 768px) {
        .detail-section {
            grid-template-columns: 1fr;
            gap: 30px;
            padding: 40px 6%;
        }

        .detail-info h1 {
            font-size: 28px;
        }
    }
</style>

<section class="detail-section">

    <div class="detail-image">
        {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        {% else %}
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" alt="{{ product.name }}">
        {% endif %}
    </div>

    <div class="detail-info">

        <p>QUIET BATTLES™ / COLLECTION 001</p>

        <h1>{{ product.name }}</h1>

        <h2>₹{{ product.price }}</h2>

        <div class="description">
            {{ product.description }}
        </div>

        <form method="POST" action="{% url 'add_to_cart' %}">
            {% csrf_token %}

            <input type="hidden" name="product_id" value="{{ product.id }}">

            <p>SELECT SIZE</p>

            <div class="size-options">
                <label><input type="radio" name="size" value="S" required> S</label>
                <label><input type="radio" name="size" value="M"> M</label>
                <label><input type="radio" name="size" value="L"> L</label>
                <label><input type="radio" name="size" value="XL"> XL</label>
            </div>

            <p>QUANTITY</p>
            <input type="number" name="quantity" value="1" min="1" required>

            <button type="submit" class="cart-btn">ADD TO CART</button>
        </form>

        <a href="{% url 'shop' %}" class="back-link">← BACK TO COLLECTION</a>

    </div>

</section>

{% endblock %}
